name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      # Windows runner 的 stdout 默认是 cp1252，打印中文会 UnicodeEncodeError
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest(26.04) 的 setup-python 还没有 3.9，用 22.04 保留对 3.9 的覆盖
        os: [ubuntu-22.04, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 校验词库
        run: python -m errsplain --validate
      - name: 运行测试
        run: python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-22.04
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 构建源码包和 wheel
        run: |
          python -m pip install "build>=1.2,<2"
          python -m build
      - name: 隔离安装 wheel 并验收
        shell: bash
        run: |
          python -m venv .venv-package
          .venv-package/bin/python -m pip install --no-deps dist/*.whl
          .venv-package/bin/errsplain --validate
          .venv-package/bin/python - <<'PY'
          from pathlib import Path

          import errsplain
          from errsplain.database import load_entries

          package_dir = Path(errsplain.__file__).resolve().parent
          assert (package_dir / "data" / "entries.json").is_file()
          assert (package_dir / "py.typed").is_file()
          print(f"wheel 安装验收通过：{len(load_entries())} 条词条")
          PY
