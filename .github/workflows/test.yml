name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      # Windows runner 的 stdout 默认是 cp1252，打印中文会 UnicodeEncodeError
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest(26.04) 的 setup-python 还没有 3.9，用 22.04 保留对 3.9 的覆盖
        os: [ubuntu-22.04, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 校验词库
        run: python -m errsplain --validate
      - name: 运行测试
        run: python -m unittest discover -s tests -v
